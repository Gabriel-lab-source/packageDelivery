<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Motoristas cadastrados no sistema</title>
</head>
<body>

    <h1>Lista de Motoristas</h1>

    <ul>
        {% for driver in drivers %}
            <li>
                <strong>{{ driver.name }}</strong><br>
                📞 {{ driver.phone }} <br>
                🚗 {{ driver.vehicle }} <br><br>
                
                <a href="/edit-driver/{{ driver.id }}">Editar</a>
            
                <form action="/delete-driver/{{ driver.id }}" method="POST" style="display:inline;">
                    <button type="submit">Excluir</button>
                </form>
            </li>
        {% endfor %}
    </ul>

    <p>
        <a href="{{ url_for('main.home') }}">
            <button>Voltar</button>
        </a>
    </p>

    {% if session.get("user_id") %}
        <a href="{{ url_for('auth.logout') }}">
            <button>Sair</button>
        </a>
    {% endif %}

</body>
</html>
