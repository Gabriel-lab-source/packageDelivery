<!DOCTYPE html>
<html>
<head>
  <title>Login</title>
</head>
<body>

  <h1>Login</h1>

  <form method="POST">

    <p>
      <label>Email:</label><br>
      <input type="email" name="email" required>
    </p>

    <p>
      <label>Senha:</label><br>
      <input type="password" name="password" required>
    </p>

    <button type="submit">Entrar</button>

  </form>

  <p>
    Não possui conta?
    <a href="/register">Cadastre-se</a>
  </p>

</body>
</html>
