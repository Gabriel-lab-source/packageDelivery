{% extends "base.html" %}

{% block title %}Login | Entrega Fácil{% endblock %}

{% block content %}
  <section class="auth-card">
    <h1>Login</h1>

    <form method="POST">
      <label>
        Email
        <input type="email" name="email" required>
      </label>

      <label>
        Senha
        <input type="password" name="password" required>
      </label>

      <button type="submit">Entrar</button>
    </form>

    <p class="muted">
      Não possui conta?
      <a href="{{ url_for('auth.register') }}">Cadastre-se</a>
    </p>
  </section>
{% endblock %}
